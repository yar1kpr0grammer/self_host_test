name: Deploy to Raspberry Pi

on:
  push:
    branches: [ "master" ] # Если ваша ветка называется main, замените на "main"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            # 1. Переходим в папку с вашим исходным кодом на Raspberry Pi
            # ОБЯЗАТЕЛЬНО замените путь ниже на ваш реальный путь!
            cd ~/self_host_test

            git fetch --all
            git reset --hard origin/master

            # 2. Получаем свежий код из репозитория
            git pull origin master

            # 3. Устанавливаем зависимости (если нужно)
            npm install

            # 4. Собираем проект
            npm run build

            # 5. Копируем собранные файлы в папку Nginx
            # Обратите внимание: если ваша папка сборки называется build (а не dist),
            # измените "dist" на "build" в строке ниже.
            sudo cp -r dist/* /var/www/html/

            # 6. Перезапускаем Nginx (опционально, но полезно)
            sudo systemctl restart nginx
